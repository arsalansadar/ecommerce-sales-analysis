<svg viewBox="0 0 1160 800" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1160" height="800" fill="#FAFAFA"/>

  <!-- Title -->
  <text x="580" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#212121">
    E-commerce Sales Analysis — Star Schema
  </text>

  <!-- ===== Relationship lines (drawn first, so boxes sit on top) ===== -->

  <!-- dim_customer -> fact_orders -->
  <line x1="160" y1="190" x2="220" y2="320" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="150" y="250" font-size="11" fill="#555555" style="paint-order: stroke; stroke: #FAFAFA; stroke-width: 4px;">customer_key (1:M)</text>

  <!-- dim_date -> fact_orders (purchase, active) -->
  <line x1="500" y1="210" x2="280" y2="320" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="400" y="260" font-size="11" fill="#555555" style="paint-order: stroke; stroke: #FAFAFA; stroke-width: 4px;">purchase_date_key (1:M, active)</text>

  <!-- dim_date -> fact_orders (delivery, inactive) -->
  <line x1="620" y1="210" x2="340" y2="320" stroke="#999999" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="470" y="300" font-size="11" fill="#999999" style="paint-order: stroke; stroke: #FAFAFA; stroke-width: 4px;">delivery_date_key (1:M, inactive)</text>

  <!-- fact_orders -> fact_order_items -->
  <line x1="460" y1="420" x2="620" y2="410" stroke="#1976D2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="405" font-size="11" fill="#1976D2" style="paint-order: stroke; stroke: #FAFAFA; stroke-width: 4px;">order_id (1:M, fact-to-fact)</text>

  <!-- dim_seller -> fact_order_items -->
  <line x1="280" y1="600" x2="680" y2="510" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="330" y="580" font-size="11" fill="#555555" style="paint-order: stroke; stroke: #FAFAFA; stroke-width: 4px;">seller_key (1:M)</text>

  <!-- dim_product -> fact_order_items -->
  <line x1="900" y1="600" x2="880" y2="510" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="890" y="560" font-size="11" fill="#555555" style="paint-order: stroke; stroke: #FAFAFA; stroke-width: 4px;">product_key (1:M)</text>

  <!-- ===== dim_customer ===== -->
  <g>
    <rect x="40" y="50" width="240" height="140" rx="6" fill="#FFF3E0" stroke="#F57C00" stroke-width="1.5"/>
    <rect x="40" y="50" width="240" height="30" rx="6" fill="#F57C00"/>
    <rect x="40" y="65" width="240" height="15" fill="#F57C00"/>
    <text x="160" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="white">dim_customer</text>
    <text x="55" y="100" font-size="11" fill="#333333">customer_key (PK)</text>
    <text x="55" y="118" font-size="11" fill="#333333">customer_unique_id</text>
    <text x="55" y="136" font-size="11" fill="#333333">customer_city</text>
    <text x="55" y="154" font-size="11" fill="#333333">customer_state</text>
  </g>

  <!-- ===== dim_date ===== -->
  <g>
    <rect x="440" y="50" width="260" height="160" rx="6" fill="#FFF3E0" stroke="#F57C00" stroke-width="1.5"/>
    <rect x="440" y="50" width="260" height="30" rx="6" fill="#F57C00"/>
    <rect x="440" y="65" width="260" height="15" fill="#F57C00"/>
    <text x="570" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="white">dim_date</text>
    <text x="455" y="100" font-size="11" fill="#333333">date_key (PK, YYYYMMDD)</text>
    <text x="455" y="118" font-size="11" fill="#333333">full_date</text>
    <text x="455" y="136" font-size="11" fill="#333333">year / month / quarter</text>
    <text x="455" y="154" font-size="11" fill="#333333">month_name / day_name</text>
    <text x="455" y="172" font-size="11" fill="#333333">is_weekend</text>
  </g>

  <!-- ===== fact_orders ===== -->
  <g>
    <rect x="160" y="320" width="300" height="230" rx="6" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
    <rect x="160" y="320" width="300" height="40" rx="6" fill="#1976D2"/>
    <rect x="160" y="345" width="300" height="15" fill="#1976D2"/>
    <text x="310" y="340" text-anchor="middle" font-size="14" font-weight="bold" fill="white">fact_orders</text>
    <text x="310" y="355" text-anchor="middle" font-size="10" fill="#E3F2FD">Grain: 1 row = 1 order</text>
    <text x="175" y="382" font-size="11" fill="#333333">order_id (PK)</text>
    <text x="175" y="400" font-size="11" fill="#333333">customer_key (FK)</text>
    <text x="175" y="418" font-size="11" fill="#333333">purchase_date_key (FK)</text>
    <text x="175" y="436" font-size="11" fill="#333333">delivery_date_key (FK)</text>
    <text x="175" y="454" font-size="11" fill="#333333">order_status, is_late, delay_days</text>
    <text x="175" y="472" font-size="11" fill="#333333">review_score</text>
    <text x="175" y="490" font-size="11" fill="#333333">order_total_value</text>
    <text x="175" y="508" font-size="11" fill="#333333">total_payment_value</text>
    <text x="175" y="526" font-size="11" fill="#333333">primary_payment_type</text>
  </g>

  <!-- ===== fact_order_items ===== -->
  <g>
    <rect x="620" y="320" width="300" height="190" rx="6" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
    <rect x="620" y="320" width="300" height="40" rx="6" fill="#1976D2"/>
    <rect x="620" y="345" width="300" height="15" fill="#1976D2"/>
    <text x="770" y="340" text-anchor="middle" font-size="14" font-weight="bold" fill="white">fact_order_items</text>
    <text x="770" y="355" text-anchor="middle" font-size="10" fill="#E3F2FD">Grain: 1 row = 1 order item</text>
    <text x="635" y="382" font-size="11" fill="#333333">order_id + order_item_id (PK)</text>
    <text x="635" y="400" font-size="11" fill="#333333">product_key (FK)</text>
    <text x="635" y="418" font-size="11" fill="#333333">seller_key (FK)</text>
    <text x="635" y="436" font-size="11" fill="#333333">price</text>
    <text x="635" y="454" font-size="11" fill="#333333">freight_value</text>
    <text x="635" y="472" font-size="11" fill="#333333">item_total</text>
  </g>

  <!-- ===== dim_seller ===== -->
  <g>
    <rect x="40" y="600" width="240" height="120" rx="6" fill="#FFF3E0" stroke="#F57C00" stroke-width="1.5"/>
    <rect x="40" y="600" width="240" height="30" rx="6" fill="#F57C00"/>
    <rect x="40" y="615" width="240" height="15" fill="#F57C00"/>
    <text x="160" y="620" text-anchor="middle" font-size="13" font-weight="bold" fill="white">dim_seller</text>
    <text x="55" y="650" font-size="11" fill="#333333">seller_key (PK)</text>
    <text x="55" y="668" font-size="11" fill="#333333">seller_id</text>
    <text x="55" y="686" font-size="11" fill="#333333">seller_city / seller_state</text>
  </g>

  <!-- ===== dim_product ===== -->
  <g>
    <rect x="860" y="600" width="250" height="150" rx="6" fill="#FFF3E0" stroke="#F57C00" stroke-width="1.5"/>
    <rect x="860" y="600" width="250" height="30" rx="6" fill="#F57C00"/>
    <rect x="860" y="615" width="250" height="15" fill="#F57C00"/>
    <text x="985" y="620" text-anchor="middle" font-size="13" font-weight="bold" fill="white">dim_product</text>
    <text x="875" y="650" font-size="11" fill="#333333">product_key (PK)</text>
    <text x="875" y="668" font-size="11" fill="#333333">product_id</text>
    <text x="875" y="686" font-size="11" fill="#333333">category_english</text>
    <text x="875" y="704" font-size="11" fill="#333333">weight_g / dimensions</text>
    <text x="875" y="722" font-size="11" fill="#333333">is_incomplete_listing</text>
  </g>

  <!-- ===== Legend ===== -->
  <g>
    <rect x="940" y="50" width="190" height="95" rx="4" fill="white" stroke="#CCCCCC" stroke-width="1"/>
    <text x="950" y="68" font-size="11" font-weight="bold" fill="#212121">Legend</text>
    <rect x="950" y="76" width="16" height="12" fill="#1976D2"/>
    <text x="972" y="86" font-size="10" fill="#333333">Fact table</text>
    <rect x="950" y="94" width="16" height="12" fill="#F57C00"/>
    <text x="972" y="104" font-size="10" fill="#333333">Dimension table</text>
    <line x1="950" y1="118" x2="966" y2="118" stroke="#555555" stroke-width="1.5"/>
    <text x="972" y="121" font-size="10" fill="#333333">Active relationship</text>
    <line x1="950" y1="132" x2="966" y2="132" stroke="#999999" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="972" y="135" font-size="10" fill="#333333">Inactive relationship</text>
  </g>
</svg>
